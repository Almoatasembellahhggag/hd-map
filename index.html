<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e9e6">
<title>heartblicke | A town of stories</title>
<meta name="description" content="heartblicke: a map of a small town and the stories kept in it. Videos in the cinema, written stories in the bookstore, audio in the record store.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1d1b'/%3E%3Cpath d='M8 26V14a8 8 0 0 1 16 0v12l-2.7-2.5-2.6 2.5-2.7-2.5-2.7 2.5-2.6-2.5z' fill='%23fff'/%3E%3Ccircle cx='13' cy='14.5' r='1.6' fill='%231d1d1b'/%3E%3Ccircle cx='19' cy='14.5' r='1.6' fill='%231d1d1b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="map/map.css?v=2">
</head>
<body>

<!-- the map itself is drawn by map/town.js -->
<svg id="map" role="img" aria-label="Map of the town. The list of places opens each place with stories."></svg>

<!-- name tags that sit on the map, one per place with stories -->
<div id="tags"></div>

<!-- the spirit of stories: it follows the pointer -->
<div id="spirit" aria-hidden="true">
  <svg viewBox="0 0 44 50" width="44" height="50">
    <path class="sheet" d="M6 46V21a16 16 0 0 1 32 0v25l-5.3-5-5.4 5-5.3-5-5.3 5-5.4-5z"/>
    <g class="eyes"><ellipse cx="16.5" cy="22" rx="2.5" ry="3.3"/><ellipse cx="27.5" cy="22" rx="2.5" ry="3.3"/></g>
  </svg>
  <i></i>
</div>

<!-- the heartblicke logo (the site menu lives on the full heartblicke site) -->
<header id="site">
  <a class="site-logo" href="index.html"><img src="assets/landing-heartblicke-logo.png" alt="heartblicke" width="1000" height="305"></a>
</header>

<!-- the map legend: every place that holds stories -->
<nav id="legend" aria-label="Places with stories">
  <h1>A town of stories</h1>
  <p class="how"><span class="mouse">Move over a place to look inside. Click to open its stories.</span><span class="finger">Tap a place to open its stories.</span></p>
  <ul id="places"></ul>
  <p id="coords" aria-hidden="true"></p>
</nav>

<!-- the stories of the place that was clicked -->
<aside id="stories" aria-labelledby="st-name"></aside>

<!-- preview shown while the pointer is over a place -->
<div id="peek" hidden aria-hidden="true">
  <div class="peek-media"></div>
  <div class="peek-prog"><i></i></div>
  <div class="peek-text">
    <p class="peek-kicker"></p>
    <p class="peek-title"></p>
    <p class="peek-meta"></p>
    <p class="peek-go"></p>
  </div>
</div>

<!-- name of a partner, shown over its boat -->
<div id="tip" hidden aria-hidden="true"></div>

<noscript>
  <p class="plain">
    <a href="store.html?shop=cinema">Cinema: watch videos</a>
    <a href="store.html?shop=books">Bookstore: read stories</a>
    <a href="store.html?shop=vinyl">Record store: listen to audio</a>
  </p>
</noscript>

<script src="map/stories.js?v=3"></script>
<script src="map/icons.js?v=2"></script>
<script src="map/town.js?v=2"></script>
</body>
</html>
